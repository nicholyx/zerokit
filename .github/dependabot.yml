# Dependabot 配置
#
# 本项目有三类依赖：npm 包（内核运行时）、Rust crates（可选的原生桌面壳）、
# 工作流里引用的 GitHub Actions。让 Dependabot 盯着它们，
# 可以及时拿到安全修复与新版本。
#
# 文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-yml-file

version: 2
updates:
  # 内核运行时依赖（根 package.json）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # 冷却期：新版本发布后等 7 天才提 PR。新版本本身有 bug、
    # 或上游账号被盗投恶意代码时，冷却期让问题有机会先暴露出来
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    # major 升级单独排期，不与日常更新混在一起：
    # - typescript 7 是世代更替（原生 Go 实现），typecheck 行为差异要单独评估
    # - @types/node 应对齐 engines 的最低支持版本（22），升 major 会让
    #   类型检查按新 Node 的 API 放行，而运行环境 22 没有那些 API
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    # 同一个依赖生态的 minor/patch 合并成一个 PR，避免 PR 数量爆炸
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nicholyx"

  # Rust 依赖（原生桌面壳，可选组件）
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "desktop"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nicholyx"

  # 工作流引用的 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      # 生成的提交信息本身即符合约定式提交规范，CI 不会拦
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "nicholyx"
