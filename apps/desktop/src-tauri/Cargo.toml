[package]
name = "zerokit-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "zerokit 桌面壳：全局热键 + 托盘 + 无边框窗口"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true