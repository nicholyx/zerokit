# demo-chain——组合动作（type = "chain"）的活示例。
# 什么场景用：一个动作的产出是另一个动作的输入（先查、再算、后写）。
[plugin]
id       = "demochain"
name     = "组合动作演示"
version  = "0.1.0"
summary  = "演示链式组合动作：第一步取数，第二步用它的结果算"
keywords = ["chain", "组合", "演示", "pipeline"]

# 第一步：独立可跑，产出结构化 JSON（被引用的动作要 output="json"）
[[action]]
id      = "gen"
title   = "产出数据"
description = "链路第一步：返回 {value: 21}。单独也能跑。"
risk    = "read"
run     = ["{python}", "chain.py", "gen"]
output  = "json"

# 第二步（被引用方）：独立可跑的翻倍动作，参数 --value 从命令行占位符拿
[[action]]
id      = "double"
title   = "翻倍"
description = "把输入翻倍。组合动作的第二步素材。"
risk    = "read"
run     = ["{python}", "chain.py", "double", "--value", "{value}"]
params  = [
  { name = "value", type = "number", description = "要翻倍的数" },
]
output  = "json"

# 第三步：组合动作。type = "chain"，[[action.step]] 按序执行，
# use 引用同插件动作；{别名.data.字段} 取上一步的结构化输出，
# params 里用占位符把上一步的结果传给下一步的参数。
# 注意：chain 动作不写 run；被引用动作要 output="json"；risk 必须 >= 每一步。
[[action]]
id      = "pipeline"
title   = "取数再翻倍"
description = "组合动作演示：跑 gen 拿 21，翻倍成 42。想看多步传值怎么写就看这个。（293：MCP --broadcast 下其他客户端能看到 value=21 的结果摘要）"
type    = "chain"
risk    = "read"
template = "拿到 {first.data.value}，翻倍后是 {second.data.doubled}"

[[action.step]]
use = "self.gen"
as  = "first"

[[action.step]]
use    = "self.double"
as     = "second"
params = { value = "{first.data.value}" }

# 第二百九十一轮⑤：pipe 示例——上一步 stdout 作为下一步 stdin（数据工作流原语）。
# 第一步 gen 输出 JSON 到 stdout；第二步（pipe = true）拿它作 stdin 数字符数。
[[action]]
id      = "pipe-count"
title   = "管道计数"
description = "管道演示：gen 的输出通过 stdin 传给计数步，返回字符数。想看 pipe 怎么写就看这个。"
type    = "chain"
risk    = "read"
template = "管道传了 {counted.data.count} 个字符"

[[action.step]]
use = "self.gen"
as  = "first"

[[action.step]]
use    = "self.count-stdin"
as     = "counted"
pipe   = true

[[action]]
id      = "count-stdin"
title   = "数 stdin 字符"
description = "读 stdin 数字符（pipe 下游示例）"
run     = ["{node}", "-e", "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.stringify({count:d.length})))"]
output  = "json"
risk    = "read"

# 第二百九十二轮⑤：pipe-export 示例——数据工作流闭环（取数 → pipe 变换 → zerocol 落盘）。
# 最后一步 use = "builtin.zerocol-export"：file 落 data_dir；columns 从前步结果按 from 路径取值。
[[action]]
id      = "pipe-export"
title   = "管道导出"
description = "闭环演示：gen 产数 → pipe 计数 → zerocol 列式落盘。数据工作流的最小完整链。"
type    = "chain"
risk    = "read"
template = "{saved}"

[[action.step]]
use = "self.gen"
as  = "first"

[[action.step]]
use    = "self.count-stdin"
as     = "counted"
pipe   = true

[[action.step]]
use = "builtin.zerocol-export"
as  = "saved"
params = { file = "pipe-export-demo", columns = [
  { name = "value", type = "int", from = "first.data.value" },
  { name = "chars", type = "int", from = "counted.data.count" },
] }
