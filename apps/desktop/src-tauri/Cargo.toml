[package]
name = "zerokit-desktop"
version = "3.2.0"
edition = "2021"
rust-version = "1.77"
description = "zerokit 桌面壳：全局热键 + 托盘 + 无边框窗口"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }   # 桌面壳本体：窗口/托盘
tauri-plugin-global-shortcut = "2"   # 全局热键唤起（Alt+Space 系）
tauri-plugin-single-instance = "2"   # 第一百三十五轮⑧：二次启动聚焦已有窗口
tauri-plugin-autostart = "2"   # 开机自启开关
tauri-plugin-deep-link = "2"   # 第一百六十五轮②：zerokit:// OS 级深链唤起         # 第一百三十五轮④：开机自启开关
serde_json = "1"   # 配置与进程间消息
serde = { version = "1", features = ["derive"] }   # 结构体序列化

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
