# 示例插件：只读、零依赖，用来演示「一份清单 → 四个面」。
# 改动这个文件后，zkit list / CLI / MCP 工具 / Web 表单会同时跟着变。

[plugin]
id       = "sysinfo"
name     = "系统信息"
version  = "1.0.0"
summary  = "查看本机 CPU、内存、磁盘和占用最高的进程，只读，零依赖"
keywords = ["系统", "cpu", "内存", "磁盘", "进程", "sysinfo", "性能"]
license  = "MIT"

# 用 worker 线程代替子进程执行，省掉整个进程创建（实测 31ms vs 116ms）。
# 前提是脚本**不要依赖相对路径**（worker 不能单独设工作目录），
# 需要定位自己的文件请用 {plugin_dir} 或 import.meta.dirname。
runtime  = "worker"

[requires]
node = ">=22"

[[action]]
id          = "overview"
title       = "系统概况"
description = "返回操作系统、CPU 型号与核数、内存占用、开机时长。想了解这台机器当前的整体状态时用这个。"
run         = ["{node}", "sysinfo.mjs"]
output      = "json"
# render = "web"：结果不用内置卡片，而是交给本插件 web/index.html 渲染（富交互仪表盘）。
# CLI/MCP 面不受影响——同一份声明，那边照样拿 JSON。
render      = "web"
risk        = "read"

[[action]]
id          = "top"
title       = "占用最高的进程"
description = "按内存占用倒序列出进程。排查机器变慢、内存吃紧时用这个。"
run         = ["{node}", "sysinfo.mjs", "top", "--limit", "{limit}"]
output      = "json"
render      = "table"
risk        = "read"

  [[action.param]]
  name        = "limit"
  type        = "integer"
  default     = 10
  description = "列出多少个进程，默认 10"

[[action]]
id          = "disk"
title       = "磁盘占用"
description = "列出各磁盘的容量、剩余空间和已用比例。检查磁盘是不是快满了用这个。"
run         = ["{node}", "sysinfo.mjs", "disk"]
output      = "json"
render      = "table"
risk        = "read"

# background = true：不会等它退出，进程由 zerokit 托管，
# 于是会出现在「运行中」（zkit ps / 界面上的运行中面板）里，可以随时结束。
[[action]]
id          = "watch"
title       = "持续监控（后台运行）"
description = "每秒打印一次内存与 CPU 负载，直到被结束。要看实时变化、或者想试试「运行中」面板怎么用时用这个。"
run         = ["{node}", "sysinfo.mjs", "watch"]
output      = "text"
risk        = "mutate"
background  = true
# 组合动作（type = "chain"）：不写代码，把已有动作按顺序拼成新能力。
# 每一步的 stdout / 结构化结果（{步骤别名.data.字段}）都能带进下一步的参数与最终模板。
# 四个面自动派生：CLI 的 run/show、MCP 工具、启动器的表单、AI 工作台都照常认它。
[[action]]
id          = "brief"
title       = "一句话播报（组合动作示例）"
description = "把「系统概况」与「最吃内存的进程」两步拼成一段话。演示 type = \"chain\"：引用 self.overview 与 self.top，用 template 把结果拼起来，全程不写代码。"
type        = "chain"
output      = "text"
risk        = "read"
template    = "{sys.data.主机名}：内存 {sys.data.内存占用率}（{sys.data.内存已用} / {sys.data.内存总量}），已开机 {sys.data.已开机}。最吃内存的进程：{top.data.0.进程}、{top.data.1.进程}"

  [[action.step]]
  use = "self.overview"
  as  = "sys"

  [[action.step]]
  use    = "self.top"
  as     = "top"
  params = { limit = 3 }
