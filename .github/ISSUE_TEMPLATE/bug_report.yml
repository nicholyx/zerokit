name: 🐛 Bug 报告
description: 命令报错、插件动作异常，或行为与文档描述不符
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！

        提交之前，请先确认两件事，这能帮我们省下大量来回沟通的时间：
        1. 搜索[已有 Issue](https://github.com/nicholyx/zerokit/issues)，避免重复
        2. 跑一次 `node src/cli.ts doctor`，环境类问题（Node 版本不够、
           缺 Python）它直接就能指出原因

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复
          required: true
        - label: 我跑过 doctor 自检，环境没有它指出的问题
          required: true
        - label: 这不是安全漏洞（安全漏洞请走 SECURITY.md 中的私有渠道，不要提公开 Issue）
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      description: 出问题的平台
      options:
        - Windows
        - macOS
        - Linux
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 你在用哪个「面」
      description: 同一份插件清单派生出的四个面，出错位置不同排查路径也不同
      options:
        - CLI（zkit 命令行）
        - 启动器界面（zkit ui）
        - MCP 工具（接给 AI 客户端）
        - 原生桌面壳（Tauri）
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本与提交
      description: main 分支请填提交日期；如果是本地改过的代码请注明
      placeholder: main @ 2026-10-09
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从终端里敲的第一条命令开始，一步步写下做了什么
      placeholder: |
        1. node src/cli.ts plugin bundled
        2. node src/cli.ts run proxy status
        3. 输出里出现 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际的行为与完整报错
      description: |
        请直接粘贴**文本输出**而不是截图。只贴你判断相关的那部分，但请保留完整的错误信息。
        注意：粘贴前先检查输出里是否包含本机路径、内网域名等不想公开的信息。
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: Node 版本、Python 版本（`node -v` / `python -V`）、涉及哪个插件、任何你觉得有帮助的线索
    validations:
      required: false
