# 把「已有的工具」接进 zerokit 的示例。
#
# proxy.py / start_proxy.bat / test_proxy.py 都在本目录里，插件完全自包含、
# 可以随手复制分享。动作不写 cwd —— 默认就在插件目录里执行；
# my_config.json / logs / proxy.pid 首次运行时会自动生成在插件目录下。

[plugin]
id       = "proxy"
name     = "白名单代理"
version  = "1.0.0"
summary  = "只允许访问 jlcops.com / jlcerp.com 的出网代理"
keywords = ["代理", "proxy", "网络", "白名单", "jlc", "出网"]
license  = "MIT"

# 这个插件的动作都是无状态的一次性任务，放进常驻解释器反复执行：
# 实测 status 从 476ms 降到 22ms（解释器启动与 import 只付一次）。
# 代价见 docs/plugin-spec.md：模块缓存保留、脚本不能读 stdin。
runtime  = "host"

[requires]
python = ">=3.10"

# 声明一个常驻服务：它自己管守护进程（甚至脱离 zerokit 独立运行），
# 所以用「端口」检测而不是管子进程——手动起的、别的程序起的，这里都看得见。
[[service]]
id          = "proxy"
title       = "白名单代理服务"
description = "只允许访问 jlcops.com / jlcerp.com 的出网代理"
port        = 28888
stop        = ["{python}", "proxy.py", "stop"]
[[action]]
id          = "status"
title       = "查看代理状态"
description = "显示代理是否在运行、监听地址、允许的域名和端口、以及开机自启状态。想确认代理是否正常工作时用这个。"
run         = ["{python}", "proxy.py", "status"]
output      = "text"
risk        = "read"

[[action]]
id          = "domains"
title       = "查看允许的域名"
description = "列出代理当前允许访问的域名白名单。想知道哪些域名能通过代理时用这个。"
run         = ["{python}", "proxy.py", "config", "domain", "list"]
output      = "text"
risk        = "read"

[[action]]
id          = "start"
title       = "启动代理"
description = "在后台启动白名单代理。发现代理没在运行时用这个。"
run         = ["{python}", "proxy.py", "start"]
output      = "text"
risk        = "mutate"

[[action]]
id          = "stop"
title       = "停止代理"
description = "停掉正在运行的白名单代理。"
run         = ["{python}", "proxy.py", "stop"]
output      = "text"
risk        = "mutate"

[[action]]
id          = "restart"
title       = "重启代理"
description = "重启白名单代理，用于让改动后的配置生效。"
run         = ["{python}", "proxy.py", "restart"]
output      = "text"
risk        = "mutate"

[[action]]
id          = "allow-domain"
title       = "添加允许域名"
description = "把一个域名加入代理白名单，改完约 2 秒自动生效。需要放行新的站点时用这个。"
run         = ["{python}", "proxy.py", "config", "domain", "add", "{domain}"]
output      = "text"
risk        = "mutate"

  [[action.param]]
  name        = "domain"
  type        = "string"
  required    = true
  description = "要允许的域名，例如 example.com（写主域名即包含它的所有子域）"

[[action]]
id          = "auth"
title       = "设置代理认证"
description = "开启或修改代理的 HTTP Basic 认证用户名密码。改了之后所有走这个代理的客户端都要填上。"
run         = ["{python}", "proxy.py", "config", "auth", "basic", "{user}", "{password}"]
output      = "text"
risk        = "destructive"

  [[action.param]]
  name        = "user"
  type        = "string"
  required    = true
  description = "认证用户名"

  [[action.param]]
  name        = "password"
  type        = "string"
  required    = true
  secret      = true
  description = "认证密码"