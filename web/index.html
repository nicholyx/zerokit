<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="zk-token" content="__TOKEN__">
<title>zerokit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">

  <!-- data-tauri-drag-region：在 Tauri 壳里（无边框窗口）这一条可以拖动窗口；浏览器里是无害的未知属性 -->
  <header class="bar" data-tauri-drag-region>
    <div class="brand">
      <span class="dot" id="modeDot"></span>
      <span class="name">zerokit</span>
      <span class="mode" id="modeLabel">命令</span>
    </div>
    <div class="bar-right">
      <span class="hint-inline" id="count"></span>
      <button class="ghost run-chip" id="plugBtn" title="管理插件：查看来源与版本、安装、更新、卸载">插件 <b id="plugCount">0</b></button>
      <button class="ghost run-chip" id="psBtn" title="查看正在运行的进程与服务">运行中 <b id="psCount">0</b></button>
      <button class="ghost run-chip" id="marketBtn" title="浏览集市：装插件不用记地址">集市 <b id="marketCount">0</b></button>
      <button class="ghost" id="reloadBtn" title="重新读取插件" data-i18n="reload">重新加载</button>
      <button class="ghost theme-btn" id="themeBtn" title="切换主题：跟随系统 → 深色 → 浅色">◐ 跟随系统</button>
      <button class="ghost theme-btn" id="themeFast" title="深色 / 浅色一键切换（Ctrl+Shift+D）" aria-label="深色 / 浅色一键切换">☀</button>
      <button class="ghost" id="langBtn" title="Switch language / 切换语言">中/EN</button>
    </div>
  </header>

  <div id="themePop" class="theme-pop hidden"></div>

  <div class="search-row" id="searchRow">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="输入插件名或动作，回车执行…   （开头打 ? 切到工作台）">
    <button class="ghost clip-btn" id="clipBtn"
            title="读剪贴板内容：智能匹配会判断它是什么（链接/时间戳/颜色…）并推荐对应动作">剪贴板</button>
    <kbd class="esc-hint">Esc</kbd>
  </div>

  <main id="stage">
    <div id="listView" class="list-view">
      <div id="listTools" class="list-tools"></div>
      <ul id="list" class="list" role="listbox"></ul>
      <div id="empty" class="empty" role="status">没有匹配的插件动作</div>
    </div>
    <div id="detailView" class="detail-view hidden"></div>
    <div id="plugView" class="plug-view hidden"></div>
    <div id="psView" class="ps-view hidden"></div>
    <div id="marketView" class="plug-view hidden"></div>
    <div id="logsView" class="plug-view hidden"></div>
    <div id="doctorView" class="plug-view hidden"></div>
    <div id="allowView" class="plug-view hidden"></div>
    <div id="workbench" class="workbench hidden"></div>
  </main>

  <footer class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span><kbd>Enter</kbd> 打开 / 执行</span>
    <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 确认并记住（下次不再问）</span>
    <span><kbd>Esc</kbd> 返回</span>
    <span class="foot-link" id="savedBtn" title="收藏的结果：钉住重要的输出（#/saved）" data-i18n="footerSaved">收藏</span>
    <span class="foot-link" id="timersBtn" title="定时任务：界面开着才跑的自动执行" data-i18n="footerTimers">定时</span>
    <span class="foot-link" id="briefBtn" title="今日简报：跑了多少、成败、最常用" data-i18n="footerBrief">简报</span>
    <span class="foot-link" id="logsBtn" title="审计日志：每次执行、被拒、失败都记着" data-i18n="footerLogs">日志</span>
    <span class="foot-link" id="doctorBtn" title="环境自检：解释器、插件依赖、必填配置" data-i18n="footerDoctor">自检</span>
    <span class="foot-link" id="helpBtn" title="打开快捷键速查（Ctrl + /）"><kbd>Ctrl</kbd>+<kbd>/</kbd> <span data-i18n="footerShortcuts">快捷键</span></span>
     <span class="foot-link" id="guideBtn" title="使用指南：搜索、监控、配置档、备份都在这页说清楚" data-i18n="footerGuide">使用指南</span>
  </footer>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
